[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qg"
version = "0.1.0"
description = "Graph-constrained multi-agent multiple-choice question generator for QG."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "QG" }]
dependencies = ["Jinja2>=3.1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
qg = "qg_v2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qg_v2 = ["templates/*.j2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
